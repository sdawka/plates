# Paste into https://api.slack.com/apps -> Create New App -> From a manifest.
# URLs point at the deployed Worker, https://plates.webisoft.workers.dev
display_information:
  name: Plates
  description: Puts asks on the right person's plate and keeps them there until they're done.
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: Plates keeps track of who asked whom for what. Tell it an ask to track, or ask what's on your plate and what you're waiting on.
    suggested_prompts:
      - title: What's on my plate?
        message: What's on my plate?
      - title: What am I waiting on?
        message: What am I waiting on?
      - title: Track an ask
        message: Remind me to send Dana the Q3 deck by Friday
      - title: How does Plates work?
        message: How does Plates work?
  bot_user:
    display_name: plates
    always_online: true
  shortcuts:
    - name: Put on someone's plate
      type: message
      callback_id: plates_capture
      description: Turn this message into tracked asks
  slash_commands:
    - command: /plates
      url: https://plates.webisoft.workers.dev/slack/events
      description: Put an ask on someone's plate
      usage_hint: "@bob send the Q3 deck by Friday | settings | help"
      should_escape: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:read
      - groups:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - commands
      - im:write
      - users:read
      - files:read
      - reactions:read
      - users:read.email
    user:
      - im:history
      - mpim:history
      - im:read
      - mpim:read
  redirect_urls:
    - https://plates.webisoft.workers.dev/oauth/callback
settings:
  event_subscriptions:
    request_url: https://plates.webisoft.workers.dev/slack/events
    bot_events:
      - app_mention
      - app_home_opened
      - member_joined_channel
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
  interactivity:
    is_enabled: true
    request_url: https://plates.webisoft.workers.dev/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
